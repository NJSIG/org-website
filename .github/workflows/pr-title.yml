name: pr-title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited

permissions:
  pull-requests: write

jobs:
  main:
    name: lint-pr-title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        id: lint_pr_title
        # Keep running so we can post/update a sticky error comment on failures.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            revert
            test
          scopes: |
            deps
            util
            component
            global
            field
            block
            collection
            page
            api
            style
            config
          # Disallow uppercase letters at the beginning of the subject
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            doesn't match the configured pattern. Please ensure the subject
            doesn't start with an uppercase letter.
      - uses: marocchino/sticky-pull-request-comment@v3
        # Post or update the lint error comment when the title is invalid.
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Pull Request titles must follow the [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) format.

            ${{ steps.lint_pr_title.outputs.error_message }}

            ```
            feat(ui): add Button component
            ^    ^    ^
            |    |    |__ Subject
            |    |_______ Scope
            |____________ Type
            ```
      # Delete a previous comment when the issue has been resolved
      - if: steps.lint_pr_title.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-title-lint-error
          delete: true
      - name: fail-on-invalid-title
        if: steps.lint_pr_title.outcome == 'failure'
        run: |
          echo "Invalid pull request title"
          exit 1
